<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications &amp; approvals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1F3CB3}a:hover{color:#0F2291}</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-wrap:wrap;background:#F4F6FB;font-family:Inter,system-ui,sans-serif;color:#10183A">
  <div style="flex:1 0 248px;background:#0A1450;display:flex">
    <dc-import name="Sidebar" role="management" active="dashboard" hint-size="248px,1000px"></dc-import>
  </div>
  <div style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
    <dc-import name="Topbar" role="management" hint-size="100%,64px"></dc-import>
    <main style="padding:28px 32px 48px;display:flex;flex-direction:column;gap:18px;width:100%;max-width:1280px;box-sizing:border-box">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px">
        <div>
          <div style="font-size:13px;color:#5E6583">Inbox</div>
          <h1 style="margin:2px 0 0;font-family:Montserrat,sans-serif;font-weight:600;font-size:26px">Notifications &amp; approvals</h1>
        </div>
        <button type="button" style="height:40px;padding:0 14px;border:1px solid #D5DAE8;border-radius:10px;background:#FFFFFF;font:inherit;font-size:14px;font-weight:500;color:#10183A">Mark all as read</button>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">
        <nav aria-label="Filter" style="flex:0 1 220px;min-width:200px;background:#FFFFFF;border:1px solid #E2E6F0;border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:2px">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="9"><a href="Notifications.dc.html" style="{{f.s}}"><span>{{f.l}}</span><span style="{{f.cs}}">{{f.n}}</span></a></sc-for>
        </nav>

        <section style="flex:999 1 560px;min-width:0;background:#FFFFFF;border:1px solid #E2E6F0;border-radius:14px;display:flex;flex-direction:column">
          <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
            <div style="display:flex;flex-direction:column">
              <div style="padding:12px 20px;font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#5E6583;background:#F7F8FC;border-bottom:1px solid #EEF1F7">{{g.l}}</div>
              <sc-for list="{{g.items}}" as="n" hint-placeholder-count="4">
                <div style="{{n.row}}">
                  <span style="{{n.ic}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg></span>
                  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
                    <div style="display:flex;justify-content:space-between;gap:12px"><span style="font-size:14px;font-weight:600">{{n.t}}</span><span style="font-size:12px;color:#5E6583;white-space:nowrap">{{n.w}}</span></div>
                    <span style="font-size:13px;color:#3D4566;line-height:1.5">{{n.b}}</span>
                    <sc-if value="{{n.act}}" hint-placeholder-val="{{false}}"><span style="display:flex;gap:8px;margin-top:6px"><button type="button" style="height:32px;padding:0 12px;border:1px solid #D5DAE8;border-radius:8px;background:#FFFFFF;font:inherit;font-size:12px;font-weight:600;color:#B42323">Reject</button><button type="button" style="height:32px;padding:0 12px;border:0;border-radius:8px;background:#0E7A55;font:inherit;font-size:12px;font-weight:600;color:#FFFFFF">Approve</button></span></sc-if>
                    <sc-if value="{{n.link}}" hint-placeholder-val="{{false}}"><a href="{{n.link}}" style="font-size:13px;font-weight:600;text-decoration:none;margin-top:4px">{{n.lt}} →</a></sc-if>
                  </div>
                  <sc-if value="{{n.unread}}" hint-placeholder-val="{{true}}"><span style="width:8px;height:8px;border-radius:999px;background:#1F3CB3;flex:none;margin-top:6px" aria-label="Unread"></span></sc-if>
                </div>
              </sc-for>
            </div>
          </sc-for>
        </section>

        <aside style="flex:1 1 240px;min-width:220px;background:#FFFFFF;border:1px solid #E2E6F0;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px">
          <h2 style="margin:0;font-family:Montserrat,sans-serif;font-weight:600;font-size:16px">Where you get alerts</h2>
          <label style="display:flex;align-items:center;justify-content:space-between;font-size:13px">In-app<input type="checkbox" checked style="width:18px;height:18px;accent-color:#1F3CB3"></label>
          <label style="display:flex;align-items:center;justify-content:space-between;font-size:13px">Email digest · 9:00<input type="checkbox" checked style="width:18px;height:18px;accent-color:#1F3CB3"></label>
          <label style="display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#5E6583">Push on phone<input type="checkbox" style="width:18px;height:18px;accent-color:#1F3CB3"></label>
          <div style="display:flex;justify-content:space-between;font-size:13px;color:#5E6583"><span>WhatsApp / SMS</span><span style="font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:#EDF0F6;color:#4A5270">Phase 3</span></div>
          <a href="Settings.dc.html" style="font-size:13px;font-weight:600;text-decoration:none">Notification rules →</a>
        </aside>
      </div>
    </main>
  </div>
</div>
</x-dc>

    const n = (t, b, w, d, c, unread, act, link, lt) => ({ t, b, w, d: D[d], unread, act, link, lt, ic: 'width:38px;height:38px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;background:' + C[c][0] + ';color:' + C[c][1], row: 'display:flex;gap:14px;padding:14px 20px;border-bottom:1px solid #EEF1F7;' + (unread ? 'background:#FBFCFF' : '') });

</script>
</body>
</html>
