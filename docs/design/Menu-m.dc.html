  </header>
  <div style="flex:1;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:10px">
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="7">
      <section style="display:flex;flex-direction:column;gap:6px">
        <h2 style="margin:0;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#5E6583">{{s.name}}</h2>
        <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
          <sc-for list="{{s.items}}" as="it" hint-placeholder-count="3">
            <a href="{{it.href}}" style="display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px 6px;border-radius:12px;background:#FFFFFF;border:1px solid #E2E6F0;text-decoration:none;color:#10183A">
              <span style="{{it.box}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg></span>
              <span style="font-size:11px;font-weight:600;white-space:nowrap">{{it.label}}</span>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>
  <dc-import name="TabBar" active="more" role="management" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
