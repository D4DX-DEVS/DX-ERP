<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Global search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1F3CB3}a:hover{color:#0F2291}</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-wrap:wrap;background:#F4F6FB;font-family:Inter,system-ui,sans-serif;color:#10183A">
  <div style="flex:1 0 248px;background:#0A1450;display:flex">
    <dc-import name="Sidebar" role="management" active="dashboard" hint-size="248px,1000px"></dc-import>
  </div>
  <div style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;position:relative">
    <dc-import name="Topbar" role="management" hint-size="100%,64px"></dc-import>
    <div style="flex:1;background:rgba(10,20,80,0.32);display:flex;justify-content:center;padding:48px 24px">
      <div role="dialog" aria-label="Search" style="width:100%;max-width:720px;align-self:flex-start;background:#FFFFFF;border-radius:20px;box-shadow:0 20px 48px rgba(16,24,58,0.18);display:flex;flex-direction:column;overflow:hidden">
        <label style="display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid #E2E6F0;color:#5E6583">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
          <input type="search" aria-label="Search everything" value="greenleaf" style="flex:1;min-width:0;border:0;outline:none;font:inherit;font-size:18px;color:#10183A">
          <span style="font-size:11px;font-weight:600;padding:3px 7px;border:1px solid #D5DAE8;border-radius:6px">Esc</span>
        </label>
        <div style="display:flex;gap:6px;padding:10px 20px;border-bottom:1px solid #EEF1F7;flex-wrap:wrap">
          <sc-for list="{{scopes}}" as="s" hint-placeholder-count="7"><span style="{{s.s}}">{{s.l}} <span style="opacity:0.8">{{s.n}}</span></span></sc-for>
        </div>
        <div style="display:flex;flex-direction:column;padding:6px 0 10px">
          <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
            <div style="display:flex;flex-direction:column">
              <div style="padding:10px 20px 4px;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#5E6583">{{g.l}}</div>
              <sc-for list="{{g.items}}" as="r" hint-placeholder-count="2">
                <a href="{{r.href}}" style="{{r.row}}">
                  <span style="{{r.ic}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"></path></svg></span>
                  <span style="flex:1;min-width:0"><span style="display:block;font-size:14px;font-weight:600">{{r.t}}</span><span style="display:block;font-size:12px;color:#5E6583">{{r.m}}</span></span>
                  <span style="font-size:12px;color:#5E6583">{{r.k}}</span>
                </a>
              </sc-for>
            </div>
          </sc-for>
        </div>
        <div style="display:flex;justify-content:space-between;padding:10px 20px;border-top:1px solid #EEF1F7;background:#F7F8FC;font-size:12px;color:#5E6583"><span>↑ ↓ to move · Enter to open</span><span>Results limited to what your role can see</span></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { blue: ['#E2E8FC', '#1F3CB3'], green: ['#E2F5EC', '#0E6B4B'], purple: ['#F1EAFE', '#6D28D9'], amber: ['#FFF1D9', '#8A4F00'], gray: ['#EDF0F6', '#4A5270'], orange: ['#FFEDE3', '#B03A0A'] };
    const D = { client: 'M4 8h16v11H4zM9 8V5h6v3M4 13h16', proj: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z', task: 'M9 11l3 3 8-8M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9', inv: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6', doc: 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5', move: 'M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M9 16l-4-4 4-4M5 12h11' };
    let first = true;
    const r = (t, m, k, d, c, href) => { const sel = first; first = false; return { t, m, k, d: D[d], href, ic: 'width:34px;height:34px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;background:' + C[c][0] + ';color:' + C[c][1], row: 'display:flex;align-items:center;gap:12px;padding:9px 20px;text-decoration:none;color:#10183A;' + (sel ? 'background:#F1F4FE' : '') }; };
    const S = [['All', 14, 1], ['Clients', 1], ['Projects', 1], ['Tasks', 6], ['Invoices', 3], ['Contracts', 2], ['Movements', 1]];
    return {
      scopes: S.map(([l, n, on]) => ({ l, n, s: 'height:30px;padding:0 10px;border-radius:999px;font-size:12px;display:flex;align-items:center;gap:4px;' + (on ? 'background:#1F3CB3;color:#FFFFFF;font-weight:600' : 'border:1px solid #D5DAE8;color:#3D4566;font-weight:500') })),
      groups: [
        { l: 'Client', items: [r('Greenleaf Organics Pvt Ltd', 'CL-0061 · active client · owner Sameer Hassan', 'Client', 'client', 'purple', 'Client.dc.html')] },
        { l: 'Project', items: [r('Greenleaf e-commerce revamp', 'PRJ-0241 · in progress · 68%', 'Project', 'proj', 'green', 'Project.dc.html')] },
        { l: 'Tasks', items: [r('Payment gateway retry logic', 'TSK-1798 · Arjun Nair · 5 days late', 'Task', 'task', 'blue', 'Task.dc.html'), r('Product feed sync from ERP', 'TSK-1789 · Anjali George · blocked', 'Task', 'task', 'blue', 'Task.dc.html')] },
        { l: 'Invoices & contracts', items: [r('INV/2026-27/0112', 'Catalogue & search · balance ₹2,03,400', 'Invoice', 'inv', 'amber', 'Invoice.dc.html'), r('CTR-0021 · Greenleaf AMC', 'Expires 30 Nov 2026', 'Contract', 'doc', 'gray', 'Contracts.dc.html')] },
        { l: 'Movements', items: [r('MV-2610-0218 · Sanjay Varma', 'Client meeting at Greenleaf · today 09:58 · overdue', 'Movement', 'move', 'orange', 'Movement.dc.html')] }
      ]
    };
  }
}
</script>
</body>
</html>
