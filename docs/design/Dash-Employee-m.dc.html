<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Employee dashboard — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1F3CB3}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#F4F6FB;font-family:Inter,system-ui,sans-serif;color:#10183A;display:flex;flex-direction:column">
  <header style="padding:16px 16px 10px 20px;display:flex;align-items:center;gap:12px">
    <div style="flex:1">
      <div style="font-size:12px;color:#5E6583">Wed, 21 Oct</div>
      <div style="font-family:Montserrat,sans-serif;font-weight:600;font-size:20px">Hi, Arjun</div>
    </div>
    <a href="Employee-m.dc.html" aria-label="My profile" style="width:40px;height:40px;border-radius:999px;background:#1F3CB3;color:#FFFFFF;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none">AN</a>
  </header>
  <div style="flex:1;overflow:hidden;padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px">
    <section style="background:#0A1450;color:#FFFFFF;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;color:#C3CAE8;font-weight:500">Today</span><span style="font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#E2F5EC;color:#0E6B4B">Present · in office</span></div>
      <div style="display:flex;gap:28px">
        <div><div style="font-size:12px;color:#A9B3DD">Checked in</div><div style="font-family:Montserrat,sans-serif;font-weight:600;font-size:26px">09:12</div></div>
        <div><div style="font-size:12px;color:#A9B3DD">Worked</div><div style="font-family:Montserrat,sans-serif;font-weight:600;font-size:26px">2h 28m</div></div>
      </div>
      <div style="height:8px;border-radius:999px;background:rgba(255,255,255,0.16)"><div style="width:31%;height:8px;border-radius:999px;background:#7D95EE"></div></div>
      <div style="display:flex;gap:10px">
        <a href="Movement-New-m.dc.html" style="flex:1.4;height:48px;border-radius:12px;background:#FFFFFF;color:#0A1450;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M9 16l-4-4 4-4M5 12h11"></path></svg>Going out</a>
        <button type="button" style="flex:1;height:48px;border:1px solid rgba(255,255,255,0.3);border-radius:12px;background:transparent;color:#FFFFFF;font:inherit;font-size:14px;font-weight:600">Check out</button>
      </div>
    </section>

    <section style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-family:Montserrat,sans-serif;font-weight:600;font-size:15px">Leave balance</h2><a href="Leave-m.dc.html" style="font-size:13px;font-weight:600;text-decoration:none;min-height:32px;display:flex;align-items:center">Apply</a></div>
      <div style="display:flex;gap:8px">
        <div style="flex:1;background:#FFFFFF;border:1px solid #E2E6F0;border-radius:12px;padding:10px"><div style="font-size:11px;color:#5E6583">Casual</div><div style="font-family:Montserrat,sans-serif;font-weight:600;font-size:18px">6</div></div>
        <div style="flex:1;background:#FFFFFF;border:1px solid #E2E6F0;border-radius:12px;padding:10px"><div style="font-size:11px;color:#5E6583">Sick</div><div style="font-family:Montserrat,sans-serif;font-weight:600;font-size:18px">5</div></div>
        <div style="flex:1;background:#FFFFFF;border:1px solid #E2E6F0;border-radius:12px;padding:10px"><div style="font-size:11px;color:#5E6583">Annual</div><div style="font-family:Montserrat,sans-serif;font-weight:600;font-size:18px">9</div></div>
        <div style="flex:1;background:#FFFFFF;border:1px solid #E2E6F0;border-radius:12px;padding:10px"><div style="font-size:11px;color:#5E6583">Comp</div><div style="font-family:Montserrat,sans-serif;font-weight:600;font-size:18px">1</div></div>
      </div>
    </section>

    <section style="background:#FFFFFF;border:1px solid #E2E6F0;border-radius:14px;overflow:hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px 6px"><h2 style="margin:0;font-family:Montserrat,sans-serif;font-weight:600;font-size:15px">Due soon</h2><a href="Tasks-m.dc.html" style="font-size:13px;font-weight:600;text-decoration:none;min-height:32px;display:flex;align-items:center">All 5</a></div>
      <sc-for list="{{tasks}}" as="t" hint-placeholder-count="3">
        <a href="Task-m.dc.html" style="display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid #EEF1F7;text-decoration:none;color:#10183A">
          <span style="{{t.dot}}"></span>
          <span style="flex:1;min-width:0"><span style="display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{t.title}}</span><span style="display:block;font-size:12px;color:#5E6583">{{t.project}}</span></span>
          <span style="{{t.dueStyle}}">{{t.due}}</span>
        </a>
      </sc-for>
    </section>

    <a href="Timesheet-m.dc.html" style="background:#FFFFFF;border:1px solid #E2E6F0;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-decoration:none;color:#10183A">
      <span style="width:40px;height:40px;border-radius:12px;background:#F1EAFE;color:#6D28D9;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6v3H9zM9 4.5H6a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V5.5a1 1 0 0 0-1-1h-3M9 12h6M9 16h4"></path></svg></span>
      <span style="flex:1"><span style="display:block;font-size:14px;font-weight:600">Timesheet · 17.5 / 40 h</span><span style="display:block;font-size:12px;color:#5E6583">Week 43 draft · submit by Fri</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6583" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </div>
  <dc-import name="TabBar" active="home" role="employee" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dot = (c) => 'width:10px;height:10px;border-radius:999px;flex:none;background:' + c;
    const due = (late) => 'font-size:12px;font-weight:600;white-space:nowrap;color:' + (late ? '#B42323' : '#3D4566');
    return {
      tasks: [
        { title: 'Payment gateway retry logic', project: 'Greenleaf · Urgent', due: '5d late', dueStyle: due(1), dot: dot('#B42323') },
        { title: 'Order history API pagination', project: 'Greenleaf · High', due: 'Today', dueStyle: due(0), dot: dot('#C2410C') },
        { title: 'Fix QA-0412 coupon rounding', project: 'Greenleaf · High', due: 'Thu', dueStyle: due(0), dot: dot('#C2410C') }
      ]
    };
  }
}
</script>
</body>
</html>
