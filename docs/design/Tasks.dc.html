<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1F3CB3}a:hover{color:#0F2291}</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-wrap:wrap;background:#F4F6FB;font-family:Inter,system-ui,sans-serif;color:#10183A">
  <div style="flex:1 0 248px;background:#0A1450;display:flex">
    <dc-import name="Sidebar" role="management" active="tasks" hint-size="248px,1000px"></dc-import>
  </div>
  <div style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
    <dc-import name="Topbar" role="management" hint-size="100%,64px"></dc-import>
    <main style="padding:28px 32px 48px;display:flex;flex-direction:column;gap:18px;width:100%;max-width:1280px;box-sizing:border-box">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px">
        <div>
          <div style="font-size:13px;color:#5E6583">Work</div>
          <h1 style="margin:2px 0 0;font-family:Montserrat,sans-serif;font-weight:600;font-size:26px">Tasks</h1>
        </div>
        <button type="button" style="height:40px;padding:0 16px;border:0;border-radius:10px;background:#1F3CB3;font:inherit;font-size:14px;font-weight:600;color:#FFFFFF;display:flex;align-items:center;gap:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New task</button>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
        <button type="button" style="height:38px;padding:0 12px;border:1px solid #D5DAE8;border-radius:10px;background:#FFFFFF;font:inherit;font-size:13px;font-weight:600;color:#10183A">Project: Greenleaf e-commerce ▾</button>
        <button type="button" style="height:38px;padding:0 12px;border:1px solid #D5DAE8;border-radius:10px;background:#FFFFFF;font:inherit;font-size:13px;font-weight:500;color:#3D4566">Assignee ▾</button>
        <button type="button" style="height:38px;padding:0 12px;border:1px solid #D5DAE8;border-radius:10px;background:#FFFFFF;font:inherit;font-size:13px;font-weight:500;color:#3D4566">Priority ▾</button>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#3D4566;height:38px;padding:0 4px"><input type="checkbox" style="width:16px;height:16px;accent-color:#1F3CB3">Overdue only</label>
        <span style="flex:1"></span>
        <div role="group" aria-label="View" style="display:inline-flex;padding:3px;border-radius:10px;background:#E7EAF3">
          <button type="button" style="height:32px;padding:0 12px;border:0;border-radius:8px;background:#FFFFFF;font:inherit;font-size:13px;font-weight:600;color:#10183A;box-shadow:0 1px 2px rgba(16,24,58,0.08)">Board</button>
          <button type="button" style="height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:13px;font-weight:500;color:#3D4566">List</button>
          <button type="button" style="height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:13px;font-weight:500;color:#3D4566">Calendar</button>
        </div>
      </div>

      <div style="overflow-x:auto">
        <div style="display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:14px;align-items:start;min-width:1080px">
          <sc-for list="{{cols}}" as="col" hint-placeholder-count="4">
            <section style="background:#EBEEF5;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px">
              <div style="display:flex;align-items:center;gap:8px;padding:2px 4px"><span style="{{col.dot}}"></span><h2 style="margin:0;font-size:14px;font-weight:600">{{col.n}}</h2><span style="font-size:12px;color:#5E6583;font-weight:600">{{col.c}}</span><span style="flex:1"></span><button type="button" aria-label="Add task to column" style="width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:#3D4566;font-size:18px">+</button></div>
              <sc-for list="{{col.cards}}" as="t" hint-placeholder-count="3">
                <a href="Task.dc.html" style="background:#FFFFFF;border:1px solid #E2E6F0;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:#10183A;box-shadow:0 1px 2px rgba(16,24,58,0.04)">
                  <span style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;color:#5E6583;font-family:ui-monospace,Menlo,monospace">{{t.id}}</span><span style="{{t.pri}}">{{t.p}}</span></span>
                  <span style="font-size:14px;font-weight:600;line-height:1.35">{{t.t}}</span>
                  <sc-if value="{{t.block}}" hint-placeholder-val="{{false}}"><span style="display:flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:#B42323"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM6 6l12 12"></path></svg>{{t.block}}</span></sc-if>
                  <span style="display:flex;align-items:center;gap:10px;font-size:12px;color:#5E6583">
                    <span style="{{t.av}}">{{t.a}}</span>
                    <sc-if value="{{t.intern}}" hint-placeholder-val="{{false}}"><span style="font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;background:#F1EAFE;color:#6D28D9">INTERN</span></sc-if>
                    <span style="flex:1"></span>
                    <span>{{t.sub}}</span>
                    <span style="{{t.dueS}}">{{t.due}}</span>
                  </span>
                </a>
              </sc-for>
            </section>
          </sc-for>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const P = { Urgent: ['#FDE7E7', '#B42323'], High: ['#FFEDE3', '#B03A0A'], Medium: ['#FFF1D9', '#8A4F00'], Low: ['#EDF0F6', '#4A5270'] };
    const AV = { AN: ['#E2E8FC', '#1F3CB3'], SV: ['#E2F5EC', '#0E6B4B'], FN: ['#FFEDE3', '#B03A0A'], AG: ['#E2E8FC', '#1F3CB3'], NJ: ['#F1EAFE', '#6D28D9'], RM: ['#F1EAFE', '#6D28D9'], KD: ['#EDF0F6', '#4A5270'], GS: ['#F1EAFE', '#6D28D9'] };
    const card = (id, t, p, a, due, late, sub, block, intern) => ({ id, t, p, a, due, sub, block, intern, pri: 'font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:' + P[p][0] + ';color:' + P[p][1], av: 'width:24px;height:24px;border-radius:999px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;background:' + AV[a][0] + ';color:' + AV[a][1], dueS: 'font-weight:600;color:' + (late ? '#B42323' : '#3D4566') });
    const col = (n, c, color, cards) => ({ n, c, cards, dot: 'width:10px;height:10px;border-radius:999px;background:' + color });
    return {
      cols: [
        col('To do', 6, '#8A93B2', [
          card('TSK-1840', 'Fix QA-0412 coupon rounding on cart total', 'High', 'AN', 'Thu 22', 0, '0/2', '', 0),
          card('TSK-1844', 'Usability test notes — checkout', 'Low', 'RM', 'Fri 30', 0, '', '', 1),
          card('TSK-1846', 'Order confirmation email template', 'Medium', 'FN', 'Mon 26', 0, '0/3', '', 0)
        ]),
        col('In progress', 5, '#284CC7', [
          card('TSK-1798', 'Payment gateway retry logic with idempotency', 'Urgent', 'AN', '5d late', 1, '3/5', '', 0),
          card('TSK-1789', 'Product feed sync from ERP', 'High', 'AG', '3d late', 1, '1/4', 'Blocked by client API keys', 0),
          card('TSK-1832', 'Order history API pagination', 'High', 'AN', 'Today', 0, '2/3', '', 0),
          card('TSK-1838', 'Product card component', 'Medium', 'NJ', 'Fri 23', 0, '', '', 1)
        ]),
        col('In review', 3, '#D0691F', [
          card('TSK-1806', 'Coupon admin screen', 'Medium', 'SV', '1d late', 1, '4/4', '', 0),
          card('TSK-1829', 'Checkout address autocomplete', 'Medium', 'SV', 'Fri 23', 0, '3/3', '', 0),
          card('TSK-1835', 'Landing page build', 'Low', 'GS', 'Mon 26', 0, '', '', 1)
        ]),
        col('Done', 28, '#0E9F75', [
          card('TSK-1801', 'Search filters — brand & price', 'High', 'SV', 'Done 19 Oct', 0, '5/5', '', 0),
          card('TSK-1797', 'Icon audit for storefront', 'Low', 'RM', 'Done 19 Oct', 0, '', '', 1)
        ])
      ]
    };
  }
}
</script>
</body>
</html>
