<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Out of office · record In-Time — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1F3CB3}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#F4F6FB;font-family:Inter,system-ui,sans-serif;color:#10183A;display:flex;flex-direction:column">
  <header style="padding:16px 20px 8px">
    <div style="font-size:12px;color:#5E6583">Wed 21 Oct</div>
    <h1 style="margin:0;font-family:Montserrat,sans-serif;font-weight:600;font-size:21px">Movement</h1>
  </header>
  <div style="flex:1;overflow:hidden;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px">
    <section style="background:#FFFFFF;border:1.5px solid #F2C3A6;border-radius:20px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center">
      <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#FFEDE3;color:#B03A0A"><span style="width:8px;height:8px;border-radius:999px;background:#C2410C"></span>You're out of the office</span>
      <div style="font-family:Montserrat,sans-serif;font-weight:600;font-size:44px;letter-spacing:0.01em">1:12:40</div>
      <div style="font-size:13px;color:#5E6583">elapsed since Out-Time 12:30</div>
      <div style="width:100%;display:flex;flex-direction:column;gap:6px">
        <div style="height:8px;border-radius:999px;background:#EDF0F6"><div style="width:60%;height:8px;border-radius:999px;background:#D0691F"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#5E6583"><span>Out 12:30</span><span>Back by 14:30 · 48m left</span></div>
      </div>
      <a href="Dash-Employee-m.dc.html" style="width:100%;height:56px;border-radius:16px;background:#1F3CB3;color:#FFFFFF;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M15 16l4-4-4-4M19 12H9"></path></svg>I'm back · record In-Time</a>
      <button type="button" style="width:100%;height:48px;border:1px solid #D5DAE8;border-radius:14px;background:#FFFFFF;font:inherit;font-size:15px;font-weight:600;color:#10183A">Running late? Update return time</button>
    </section>
    <section style="background:#FFFFFF;border:1px solid #E2E6F0;border-radius:14px;padding:4px 14px">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="5">
        <div style="display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #EEF1F7;font-size:14px"><span style="color:#5E6583">{{f.k}}</span><span style="font-weight:500;text-align:right">{{f.v}}</span></div>
      </sc-for>
    </section>
    <div style="font-size:12px;color:#5E6583;text-align:center;line-height:1.5">If you don't record an In-Time, your manager and HR are alerted 15 minutes after the expected return.</div>
  </div>
  <dc-import name="TabBar" active="time" role="employee" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { fields: [['Movement ID', 'MV-2610-0222'], ['Category', 'Client meeting'], ['Destination', 'Infopark Phase 2'], ['Reference', 'PRJ-0241 · Greenleaf'], ['Approval', 'Not required']].map(([k, v]) => ({ k, v })) };
  }
}
</script>
</body>
</html>
