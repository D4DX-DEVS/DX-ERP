<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reports &amp; analytics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1F3CB3}a:hover{color:#0F2291}</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-wrap:wrap;background:#F4F6FB;font-family:Inter,system-ui,sans-serif;color:#10183A">
  <div style="flex:1 0 248px;background:#0A1450;display:flex">
    <dc-import name="Sidebar" role="management" active="reports" hint-size="248px,1000px"></dc-import>
  </div>
  <div style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
    <dc-import name="Topbar" role="management" hint-size="100%,64px"></dc-import>
    <main style="padding:28px 32px 48px;display:flex;flex-direction:column;gap:18px;width:100%;max-width:1280px;box-sizing:border-box">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px">
        <div>
          <div style="font-size:13px;color:#5E6583">Operations · you see reports your role allows</div>
          <h1 style="margin:2px 0 0;font-family:Montserrat,sans-serif;font-weight:600;font-size:26px">Reports</h1>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:10px">
          <button type="button" style="height:40px;padding:0 14px;border:1px solid #D5DAE8;border-radius:10px;background:#FFFFFF;font:inherit;font-size:14px;font-weight:500;color:#10183A">1 – 21 Oct 2026 ▾</button>
          <button type="button" style="height:40px;padding:0 14px;border:1px solid #D5DAE8;border-radius:10px;background:#FFFFFF;font:inherit;font-size:14px;font-weight:500;color:#10183A">All departments ▾</button>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start">
        <div style="grid-column:span 2;display:flex;flex-direction:column;gap:16px;min-width:0">
          <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
            <section style="background:#FFFFFF;border:1px solid #E2E6F0;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px">
              <div style="display:flex;align-items:center;gap:10px"><span style="{{g.ic}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.d}}"></path></svg></span><h2 style="margin:0;font-family:Montserrat,sans-serif;font-weight:600;font-size:16px">{{g.n}}</h2></div>
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px">
                <sc-for list="{{g.items}}" as="r" hint-placeholder-count="5"><a href="Reports.dc.html" style="{{r.s}}"><span style="font-size:13px;font-weight:600">{{r.t}}</span><span style="font-size:12px;color:#5E6583">{{r.m}}</span></a></sc-for>
              </div>
            </section>
          </sc-for>
        </div>

        <aside style="background:#FFFFFF;border:1px solid #E2E6F0;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0">
          <div><div style="font-size:12px;color:#5E6583">Movement reports</div><h2 style="margin:2px 0 0;font-family:Montserrat,sans-serif;font-weight:600;font-size:18px">Time outside office · by department</h2></div>
          <div style="display:flex;gap:14px;font-size:12px;color:#3D4566"><span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:3px;background:#284CC7"></span>Official</span><span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:3px;background:#D0691F"></span>Personal</span></div>
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
            <div style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:#3D4566">{{b.n}}</span><strong>{{b.t}}</strong></div><div style="display:flex;height:12px;gap:2px"><span title="{{b.ot}}" style="{{b.o}}"></span><span title="{{b.pt}}" style="{{b.p}}"></span></div></div>
          </sc-for>
          <div style="font-size:12px;color:#5E6583;padding-top:10px;border-top:1px solid #EEF1F7">1–21 Oct · 142 movements · 6 overdue returns · personal hours visible to HR &amp; Management only</div>
          <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
            <button type="button" style="height:38px;border:1px solid #D5DAE8;border-radius:9px;background:#FFFFFF;font:inherit;font-size:13px;font-weight:600;color:#10183A">Excel</button>
            <button type="button" style="height:38px;border:1px solid #D5DAE8;border-radius:9px;background:#FFFFFF;font:inherit;font-size:13px;font-weight:600;color:#10183A">CSV</button>
            <button type="button" style="height:38px;border:1px solid #D5DAE8;border-radius:9px;background:#FFFFFF;font:inherit;font-size:13px;font-weight:600;color:#10183A">PDF</button>
          </div>
          <button type="button" style="height:40px;border:0;border-radius:10px;background:#1F3CB3;font:inherit;font-size:13px;font-weight:600;color:#FFFFFF">Email monthly to Management</button>
        </aside>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1150}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { blue: ['#E2E8FC', '#1F3CB3'], orange: ['#FFEDE3', '#B03A0A'], green: ['#E2F5EC', '#0E6B4B'], purple: ['#F1EAFE', '#6D28D9'] };
    const card = (on) => 'display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:10px;text-decoration:none;color:#10183A;' + (on ? 'border:2px solid #1F3CB3;background:#F1F4FE' : 'border:1px solid #E2E6F0');
    const g = (n, c, d, items) => ({ n, d, ic: 'width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:' + C[c][0] + ';color:' + C[c][1], items: items.map(([t, m, on]) => ({ t, m, s: card(on) })) });
    const B = [['Business Dev.', 31, 2], ['Engineering', 18, 6], ['Design', 9, 3], ['Finance & HR', 14, 2], ['QA', 3, 5], ['Marketing', 6, 1]];
    const w = (h) => (h / 33 * 100).toFixed(1);
    return {
      groups: [
        g('People & HR', 'blue', 'M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z', [['Employee directory', 'Status, department, type'], ['Attendance summary', 'Daily · monthly · late & early'], ['Working hours', 'By person and department'], ['Leave usage & balances', 'By type and date range'], ['Payroll & stipend summary', 'Restricted · Finance'], ['Intern progress & reviews', 'Tasks, evaluations, completion']]),
        g('Movement register', 'orange', 'M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M9 16l-4-4 4-4M5 12h11', [['Daily movement register', 'Every Out / In for a date'], ['Employee-wise history', 'One person over a range'], ['In-Time & Out-Time', 'Raw timestamps'], ['Time outside office', 'By person and department', 1], ['Late returns & overdue', 'Exceeded expected return'], ['Corrections & approvals', 'Audit of changes']]),
        g('Projects & delivery', 'green', 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z', [['Project progress', 'Milestones and delivery'], ['Overdue tasks', 'By project and assignee'], ['Workload & timesheets', 'Logged vs capacity'], ['Estimated vs actual', 'Effort by project'], ['QA issues & resolution', 'Open, reopened, time to fix']]),
        g('Sales & finance', 'purple', 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6', [['Enquiries & conversion', 'Lead source to won'], ['Pipeline & proposals', 'Stage, value, ageing'], ['Invoices & payments', 'Issued, paid, overdue'], ['Outstanding receivables', 'Client-wise ageing'], ['Expenses by category', 'And by project'], ['Project profitability', 'Billed vs cost estimate']])
      ],
      bars: B.map(([n, o, p]) => ({ n, t: (o + p) + ' h', o: 'background:#284CC7;border-radius:4px 0 0 4px;width:' + w(o) + '%', p: 'background:#D0691F;border-radius:0 4px 4px 0;width:' + w(p) + '%', ot: n + ' official ' + o + ' h', pt: n + ' personal ' + p + ' h' }))
    };
  }
}
</script>
</body>
</html>
